<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PinkStudy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#100D14;--surface:#1C1722;--card:#251D2B;--pink:#FF5CA8;--lpink:#FF9CCB;--accent:#C83D83;--text:#FFF3F8;--muted:#B9A9B5;--line:#3B2B3B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;margin-bottom:6px}h2{font-size:20px}h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lpink);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font:700 21px Poppins}
.logo{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:linear-gradient(135deg,var(--pink),var(--accent));display:grid;place-items:center;font-style:normal;font-size:18px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);text-align:left;font-weight:500}
nav button:hover{background:var(--card);color:var(--text)}
nav button.on{background:var(--card);color:var(--lpink)}
nav button.mk{background:linear-gradient(135deg,var(--pink),var(--accent));color:#1a0a13;font-weight:600;margin:6px 0}
nav button span{width:20px;text-align:center}
main{padding:36px 32px 60px;max-width:860px;width:100%;margin:0 auto}
.sub{color:var(--muted);margin:0 0 24px}
.btn{padding:12px 22px;border-radius:999px;font-weight:600;background:linear-gradient(135deg,var(--pink),var(--accent));color:#1a0a13;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.link{color:var(--lpink)}.link:hover{text-decoration:underline}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,#3a1d33,var(--card));border:1px solid var(--accent);border-radius:24px;padding:26px;margin-bottom:20px}
.hero p{margin:6px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat b{display:block;font:600 28px Poppins}.stat span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.set{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;transition:border-color .2s}
.set:hover{border-color:var(--pink)}.set p{margin:2px 0 12px;color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink))}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;padding:12px 16px}
.in:focus{border-color:var(--pink);outline:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:14px}
code{background:var(--bg);padding:1px 6px;border-radius:6px;color:var(--lpink)}
.row2{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}.c{justify-content:center}
.hint{color:var(--muted);font-size:14px;margin:0}
.er{display:grid;grid-template-columns:1fr 1.4fr 36px;gap:8px;margin-bottom:8px}
.x{color:var(--muted);font-size:22px;border-radius:10px}.x:hover{background:var(--card);color:var(--lpink)}
.err{color:var(--lpink);min-height:1.4em;margin:6px 0}
.cr{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.cr:last-child{border:0}.cr span{color:var(--muted)}
.flip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:280px;margin:6px 0 12px;padding:28px;border-radius:26px;background:var(--card);border:1px solid var(--pink);font:600 26px/1.3 Poppins;text-align:center;animation:fl .3s}
.flip.f{background:linear-gradient(135deg,#3a1d33,var(--card))}.flip small{font:400 14px Inter;color:var(--muted)}
@keyframes fl{from{transform:rotateX(60deg);opacity:.3}to{transform:none;opacity:1}}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--pink)}.opt:disabled{cursor:default}
.opt.ok{border-color:#6fdc9c;background:#1d2b25}.opt.bad{border-color:var(--accent);background:#2b1a24}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:14px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--muted)}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--pink),var(--accent));min-height:4px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--card);border:1px solid var(--pink);padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 10% 6%,rgba(255,92,168,.38),transparent 70%),radial-gradient(620px 520px at 92% 32%,rgba(200,61,131,.32),transparent 70%),radial-gradient(520px 520px at 38% 104%,rgba(255,156,203,.2),transparent 70%)}
aside,.stat,.set,.panel,.in,.opt,.flip,.hero,.toast,.btn.ghost{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
aside{background:rgba(28,23,34,.55)}
.hero{background:linear-gradient(135deg,rgba(255,92,168,.24),rgba(255,255,255,.05));border-color:rgba(255,156,203,.35)}
.flip.f{background:linear-gradient(135deg,rgba(255,92,168,.28),rgba(255,255,255,.06))}
.in{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:rgba(255,92,168,.18);box-shadow:inset 0 0 0 1px rgba(255,156,203,.3)}
.bar{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
@media(max-width:760px){
.app{display:block}
aside{position:fixed;inset:auto 0 0 0;height:auto;z-index:10;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.brand{display:none}nav{flex-direction:row;justify-content:space-around}
nav button{flex-direction:column;gap:0;padding:6px 8px;font-size:12px;border-radius:12px}
nav button.mk{margin:0;padding:6px 14px}
main{padding:24px 18px 110px}.hero{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.er{grid-template-columns:1fr 36px}.er input:nth-child(2){grid-column:1/2}.cr{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside><button class="brand" data-go="home" aria-label="PinkStudy home"><i class="logo" aria-hidden="true">✦</i>PinkStudy</button><nav id="nav" aria-label="Main"></nav></aside><button class="me" id="me" data-a="menu" aria-label="Profile menu" aria-haspopup="true" aria-expanded="false"></button><div class="menu" id="menu" role="menu"></div>
<main id="page"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
let S={sets:[],log:{},hist:[]},V={v:"home"},cl=null,st=null,z=null,tt;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("ps2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(window.SK||"ps2_nologin",JSON.stringify(S))}catch(e){toast("Couldn’t save in this browser.")}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sh=a=>[...a].sort(()=>Math.random()-.5);
const gs=id=>S.sets.find(s=>s.id===id);
const isDue=c=>!c.due||c.due<=Date.now();
const day=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString("en-CA")};
const INT=[0,1,3,7,14];
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function grade(c,ok){c.box=ok?Math.min((c.box||0)+1,4):0;c.due=Date.now()+(ok?INT[c.box]*864e5:0);S.log[day(0)]=(S.log[day(0)]||0)+1;save()}
function streak(){let n=0,o=S.log[day(0)]?0:1;while(S.log[day(o)]){n++;o++}return n}
const NAV=[["home","Home","⌂"],["dash","Dashboard","▦"]];
function go(v,id){V={v,id};render()}
function render(k){
$("#nav").innerHTML=NAV.map(n=>`<button data-go="${n[0]}" class="${n[0]===V.v||(n[0]==="lib"&&V.v==="set")||(n[0]==="dash"&&window.DM)?"on":""} ${n[0]==="home"?"hm":""}"><span aria-hidden="true">${n[2]}</span>${n[1]}</button>`).join("");
$("#page").innerHTML=({home,lib,set:setv,create,study:studyv,quiz:quizv,prog,ai:window.aiv,rev:window.revv,exp:window.expv,cfg:window.cfgv,imp:window.impv,ach:window.achv,info:window.infov,dash:window.dashv})[V.v]();if(!k)scrollTo(0,0)}
const card=s=>{const k=s.cards.filter(c=>c.box>=3).length,d=s.cards.filter(isDue).length;return `<button class="set" data-open="${s.id}"><h3>${esc(s.title)}</h3><p>${s.cards.length} cards · ${d} due${s.subject?" · "+esc(s.subject):""}</p><div class="bar"><b style="width:${k/s.cards.length*100}%"></b></div><small style="color:var(--muted)">${k} remembered</small></button>`};
function home(){const all=S.sets.flatMap(s=>s.cards),d=all.filter(isDue).length,k=all.filter(c=>c.box>=3).length;
return `<h1>${S.sets.length?"Welcome back":"Welcome to PinkStudy"}</h1><p class="sub">Your personal space to learn, create, and master anything.</p>
<div class="hero"><div><h2>${d?d+" card"+(d>1?"s":"")+" ready to review":S.sets.length?"You’re all caught up":"Make your first set"}</h2><p>${d?"A few minutes keeps your memory fresh.":S.sets.length?"Open a set to practice anyway.":"Paste your notes and PinkStudy turns them into flashcards."}</p></div><button class="btn" data-go="${d?"study":S.sets.length?"lib":"create"}">${d?"Start studying":S.sets.length?"Open library":"Create a set"}</button></div>
<div class="stats"><div class="stat"><b>${streak()}</b><span>Day streak</span></div><div class="stat"><b>${k}</b><span>Cards remembered</span></div><div class="stat"><b>${S.sets.length}</b><span>Sets</span></div></div>
${S.sets.length?`<h2>Recent sets</h2><div class="grid">${S.sets.slice(0,4).map(card).join("")}</div>`:""}`}
const gridHtml=f=>{const l=S.sets.filter(s=>(s.title+" "+(s.subject||"")).toLowerCase().includes(f));return l.map(card).join("")||`<div class="empty" style="grid-column:1/-1">${S.sets.length?"No sets match your search.":"No sets yet. Select Create to make one."}</div>`};
function lib(){return `<h1>Library</h1><p class="sub">Everything you’ve made, saved on this device.</p><input class="in" id="q" placeholder="Search your sets" aria-label="Search your sets"><div class="grid" id="grid">${gridHtml("")}</div>`}
function setv(){const s=gs(V.id);if(!s)return lib();const d=s.cards.filter(isDue).length;
return `<button class="link" data-go="lib">← Library</button><h1 style="margin-top:12px">${esc(s.title)}</h1><p class="sub">${s.cards.length} cards · ${d} due</p><div class="row2" style="margin-top:0"><button class="btn" data-a="sstudy">Study</button><button class="btn ghost" data-a="squiz">Take a quiz</button></div><div class="panel">${s.cards.map(c=>`<div class="cr"><b>${esc(c.t)}</b><span>${esc(c.d)}</span></div>`).join("")}</div><p class="hint"><button class="link" data-a="edit">Edit set</button> · <button class="link" data-a="del">Delete set</button></p>`}
const rows=()=>cl.cards.map((c,i)=>`<div class="er"><input class="in" data-i="${i}" data-f="t" value="${esc(c.t)}" placeholder="Term" aria-label="Term ${i+1}"><input class="in" data-i="${i}" data-f="d" value="${esc(c.d)}" placeholder="Definition" aria-label="Definition ${i+1}"><button class="x" data-a="rm" data-i="${i}" aria-label="Remove card ${i+1}">×</button></div>`).join("");
function newSet(){cl={title:"",cards:[{t:"",d:""},{t:"",d:""}]};go("create")}
function create(){if(!cl)cl={title:"",cards:[{t:"",d:""},{t:"",d:""}]};
return `<h1>${cl.id?"Edit set":"Create a set"}</h1><p class="sub">Type your cards, or paste notes and let PinkStudy make them.</p>
<input class="in" id="ti" placeholder="Set title, e.g. Cell biology" maxlength="80" value="${esc(cl.title)}" aria-label="Set title"><input class="in" id="su" placeholder="Subject or folder (optional)" maxlength="40" value="${esc(cl.subject||"")}" aria-label="Subject" style="margin-top:10px">
<div class="panel"><label for="src">Paste notes, or type cards as <code>term | definition</code></label><textarea class="in" id="src" rows="5" placeholder="Mitochondria | Makes energy for the cell"></textarea><div class="row2"><button class="btn ghost" data-a="make" id="mkb">Make cards</button><p class="hint" id="hint">Plain notes become cards with AI. Lines with | are used as written.</p></div></div>
<div id="rows">${rows()}</div><div class="row2"><button class="link" data-a="add">+ Add a card</button></div><div class="err" id="err" role="alert"></div><button class="btn" data-a="save">Save set</button>`}
async function make(){const t=$("#src").value.trim(),h=$("#hint"),b=$("#mkb");if(!t){h.textContent="Paste some notes first.";return}
const ls=t.split("\n").filter(x=>x.trim()),pp=ls.map(l=>l.split("|").map(x=>x.trim())).filter(p=>p[0]&&p[1]);let cards=[];
if(pp.length>=2&&pp.length*2>=ls.length)cards=pp.map(p=>({t:p[0],d:p.slice(1).join(" | ")}));
else{b.disabled=true;h.textContent="Making cards…";
try{const sm=window.claude&&await claude.use("sample");if(!sm)throw 0;
const r=await sm.json("Turn these study notes into 8 to 15 flashcards. Return only a JSON array like [{\"t\":\"term or question\",\"d\":\"short answer\"}]. Keep answers under 25 words.\n\nNotes:\n"+t.slice(0,6000));
cards=(Array.isArray(r)?r:r.cards||[]).filter(c=>c&&c.t&&c.d).map(c=>({t:String(c.t),d:String(c.d)}))}
catch(e){h.textContent="AI isn’t available here. Type cards as term | definition instead.";b.disabled=false;return}
b.disabled=false}
if(!cards.length){h.textContent="No cards found. Try longer notes.";return}
cl.cards=cl.cards.filter(c=>c.t||c.d).concat(cards);$("#rows").innerHTML=rows();$("#src").value="";h.textContent="Added "+cards.length+" cards. Edit them below, then save."}
function startStudy(id){const pool=id?gs(id).cards:S.sets.flatMap(s=>s.cards);let q=pool.filter(isDue);if(!q.length&&id)q=[...pool];
st=q.length?{q:sh(q),flip:0,ok:0,miss:0,n:q.length}:{empty:1};go("study")}
function studyv(){if(!st||st.empty)return `<h1>Study</h1><div class="hero"><div><h2>You’re all caught up</h2><p>No cards are due right now. Open a set to practice anyway.</p></div><button class="btn" data-go="lib">Open library</button></div>`;
if(!st.q.length)return `<h1>Session complete</h1><div class="hero"><div><h2>${st.ok} remembered, ${st.miss} to revisit</h2><p>Cards you missed come back sooner.</p></div><button class="btn" data-go="home">Done</button></div>`;
const c=st.q[0];return `<div class="bar"><b style="width:${(st.n-st.q.length)/st.n*100}%"></b></div><p class="sub">${st.q.length} left</p><button class="flip ${st.flip?"f":""}" data-a="flip"><span>${esc(st.flip?c.d:c.t)}</span><small>${st.flip?"Answer":"Question"} · tap to flip</small></button><div class="row2 c"><button class="btn ghost" data-a="miss">Still learning</button><button class="btn" data-a="got">Got it</button></div><p class="hint" style="text-align:center">Keys: space flips · ← still learning · → got it</p>`}
function startQuiz(id){const s=gs(id);z={id,i:0,sc:0,pk:null,done:0,qs:sh(s.cards).map(c=>({p:c.t,a:c.d,o:sh([c,...sh(s.cards.filter(x=>x!==c)).slice(0,3)]).map(x=>x.d)}))};go("quiz")}
function quizv(){const s=gs(z.id);if(z.done)return `<h1>Quiz results</h1><div class="hero"><div><h2>${Math.round(z.sc/z.qs.length*100)}% · ${z.sc} of ${z.qs.length} correct</h2><p>${esc(s.title)}</p></div><button class="btn" data-a="retake">Retake quiz</button></div><button class="link" data-open="${s.id}">← Back to set</button>`;
const q=z.qs[z.i];return `<div class="bar"><b style="width:${z.i/z.qs.length*100}%"></b></div><p class="sub">Question ${z.i+1} of ${z.qs.length}</p><h2 style="margin-bottom:18px">Which answer matches “${esc(q.p)}”?</h2>${q.o.map((o,i)=>`<button class="opt ${z.pk===null?"":o===q.a?"ok":i===z.pk?"bad":""}" data-a="pick" data-i="${i}" ${z.pk===null?"":"disabled"}>${esc(o)}</button>`).join("")}${z.pk===null?"":`<p>${q.o[z.pk]===q.a?"Correct.":"Not quite. The answer is shown in green."}</p><button class="btn" data-a="qnext">${z.i+1<z.qs.length?"Next question":"See results"}</button>`}`}
function prog(){const all=S.sets.flatMap(s=>s.cards),k=all.filter(c=>c.box>=3).length,h=S.hist,acc=h.length?Math.round(h.reduce((a,x)=>a+x.sc/x.n,0)/h.length*100)+"%":"–";
const ds=[6,5,4,3,2,1,0].map(o=>({l:new Date(Date.now()-o*864e5).toLocaleDateString("en",{weekday:"short"}),n:S.log[day(o)]||0})),mx=Math.max(1,...ds.map(d=>d.n));
return `<h1>Progress</h1><p class="sub">Based on what you’ve actually studied on this device.</p><div class="stats"><div class="stat"><b>${streak()}</b><span>Day streak</span></div><div class="stat"><b>${k}/${all.length}</b><span>Cards remembered</span></div><div class="stat"><b>${acc}</b><span>Average quiz score</span></div></div>
<div class="panel"><h3>Cards reviewed this week</h3><div class="chart">${ds.map(d=>`<div>${d.n||""}<i style="height:${d.n/mx*80}%"></i>${d.l}</div>`).join("")}</div></div>
<div class="panel"><h3>Recent quizzes</h3>${h.slice(-5).reverse().map(x=>`<div class="cr"><b>${esc(x.t)}</b><span>${Math.round(x.sc/x.n*100)}% · ${QL[x.m]?QL[x.m]+" · ":""}${x.d}</span></div>`).join("")||`<p class="hint">No quizzes yet. Open a set and take one.</p>`}</div>`}
function act(b){const a=b.dataset.a,i=+b.dataset.i,s=gs(V.id);
if(a==="make")return make();
if(a==="add"){cl.cards.push({t:"",d:""});$("#rows").innerHTML=rows();return}
if(a==="rm"){cl.cards.splice(i,1);$("#rows").innerHTML=rows();return}
if(a==="save"){const t=cl.title.trim(),cs=cl.cards.filter(c=>c.t.trim()&&c.d.trim()).map(c=>({...c,t:c.t.trim(),d:c.d.trim()})),e=$("#err");
if(!t){e.textContent="Give your set a title.";return}if(cs.length<2){e.textContent="Add at least 2 cards with both a term and a definition.";return}
const su=(cl.subject||"").trim();if(cl.id){const o=gs(cl.id);o.title=t;o.subject=su;o.cards=cs}else S.sets.unshift({id:Date.now().toString(36),title:t,subject:su,cards:cs});
save();toast("Saved “"+t+"”");const id=cl.id||S.sets[0].id;cl=null;go("set",id);return}
if(a==="sstudy")return startStudy(s.id);
if(a==="squiz")return s.cards.length<2?toast("A quiz needs at least 2 cards."):startQuiz(s.id);
if(a==="edit"){cl={id:s.id,title:s.title,subject:s.subject||"",cards:s.cards.map(c=>({...c}))};return go("create")}
if(a==="del"){if(confirm("Delete “"+s.title+"”? This can’t be undone.")){S.sets=S.sets.filter(x=>x!==s);save();toast("Set deleted");go("lib")}return}
if(a==="flip")st.flip=!st.flip;
else if(a==="got"||a==="miss"){const c=st.q.shift();st.flip=0;if(a==="got"){st.ok++;grade(c,true)}else{st.miss++;grade(c,false);st.q.push(c)}}
else if(a==="pick"){const q=z.qs[z.i];z.pk=i;if(q.o[i]===q.a)z.sc++}

else if(a==="retake")return startQuiz(z.id);

<script>
S.revs=S.revs||[];
const AI={summarize:["Summarize","Paste notes to get short bullet points."],explain:["Explain","Type a concept you find confusing."],reviewer:["Reviewer","Paste notes to get a structured reviewer."],plan:["Study plan","Describe your goal, e.g. “Pass my biology exam in 7 days”."],questions:["Questions","Paste notes to get practice questions with answers."],tutor:["Tutor","Ask any question and get a step-by-step answer."]};
const PR={summarize:"Summarize these notes into clear bullet points a student can revise from.",explain:"Explain this concept simply, with one analogy and one example.",reviewer:"Turn these notes into a structured study reviewer with headings, key terms and bullet points.",plan:"Create a realistic day-by-day study plan for this goal. Keep each day to 2 or 3 short tasks.",questions:"Write 8 practice questions from these notes. After each, give the answer and a one-line explanation.",tutor:"You are a friendly tutor. Answer the student's question step by step, then ask one follow-up question to check understanding."};
let A={tool:"summarize",inp:"",out:"",busy:0};
async function ask(p){const sm=window.claude&&await claude.use("sample");if(!sm)throw 0;return (await sm(p)).text}
function aiv(){return `<h1>AI Studio</h1><p class="sub">Pick a tool, add your text, then edit the result before saving. Flashcards are made on the Create page.</p><div class="chips">${Object.entries(AI).map(([k,v])=>`<button class="chip ${k===A.tool?"on":""}" data-a="tool" data-k="${k}">${v[0]}</button>`).join("")}</div><div class="panel"><label for="ain">${AI[A.tool][1]}</label><textarea class="in" id="ain" rows="6">${esc(A.inp)}</textarea><div class="row2"><button class="btn" data-a="gen" ${A.busy?"disabled":""}>${A.busy?"Working…":"Generate"}</button></div></div>${A.out?`<div class="panel"><label for="aout">Result (you can edit it)</label><textarea class="in" id="aout" rows="12">${esc(A.out)}</textarea><div class="row2"><button class="btn" data-a="asave">Save as reviewer</button></div></div>`:""}`}

function revv(){if(V.id)return rdv();return `<h1>Reviewers</h1><p class="sub">Your notes and AI-made reviewers.</p><div class="row2" style="margin-top:0"><button class="btn" data-go="imp">Import lecture</button><button class="btn ghost" data-a="rnew">New reviewer</button></div><div class="grid">${S.revs.map(r=>`<button class="set" data-a="ropen" data-id="${r.id}"><h3>${esc(r.title)}</h3><p>${esc(r.body.slice(0,90))||"Empty"}</p></button>`).join("")||`<div class="empty" style="grid-column:1/-1">No reviewers yet. Write one, or generate one in AI Studio.</div>`}</div>`}

const EX=[{title:"Cell Biology Basics",subject:"Biology",cards:[["Mitochondria","Produces most of the cell’s ATP"],["Ribosome","Builds proteins from amino acids"],["Nucleus","Stores DNA and controls cell activity"],["Cell membrane","Controls what enters and leaves the cell"]]},{title:"Spanish Greetings",subject:"Languages",cards:[["Buenos días","Good morning"],["¿Cómo estás?","How are you?"],["Mucho gusto","Nice to meet you"],["Hasta luego","See you later"]]},{title:"Basic Derivatives",subject:"Math",cards:[["d/dx of x²","2x"],["d/dx of sin x","cos x"],["d/dx of eˣ","eˣ"],["d/dx of ln x","1/x"]]}];
function expv(){return `<h1>Explore</h1><p class="sub">Sample public sets to try. Sharing sets between people needs accounts, which this version doesn’t have yet.</p><div class="grid">${EX.map((e,i)=>`<div class="set"><h3>${e.title}</h3><p>${e.subject} · ${e.cards.length} cards · Sample</p><button class="btn ghost" data-a="exadd" data-i="${i}">Add to my library</button></div>`).join("")}</div>`}
function cfgv(){return `<h1>Settings</h1><p class="sub">Everything is stored on this device.</p><div class="panel"><label for="nm">Your name</label><input class="in" id="nm" maxlength="30" value="${esc(S.name||"")}" placeholder="e.g. Peter" style="margin-bottom:14px"><label for="gl">Daily goal (cards per day)</label><input class="in" id="gl" type="number" min="1" max="500" value="${S.goal||20}"><div class="row2"><button class="btn" data-a="gsave">Save settings</button></div></div><div class="panel"><b>Reset</b><p class="hint">Deletes all sets, reviewers and progress on this device.</p><button class="btn ghost" data-a="reset">Delete all my data</button></div>`}
function startQuiz(id){const s=gs(id);z={id,i:0,sc:0,pk:null,done:0,qs:sh(s.cards).map((c,j)=>{const w=sh(s.cards.filter(x=>x!==c)),ty=j%3===1?"tf":j%3===2?"id":"mc";
if(ty==="tf"){const f=Math.random()<.5&&w.length>0;return{ty,p:c.t,a:f?"False":"True",shown:f?w[0].d:c.d,o:["True","False"],real:c.d}}
if(ty==="id")return{ty,p:c.d,a:c.t,o:[]};
return{ty,p:c.t,a:c.d,o:sh([c,...w.slice(0,3)]).map(x=>x.d)}})};go("quiz")}
function quizv(){const s=gs(z.id);if(z.done)return `<h1>Quiz results</h1><div class="hero"><div><h2>${Math.round(z.sc/z.qs.length*100)}% · ${z.sc} of ${z.qs.length} correct</h2><p>${esc(s.title)}</p></div><button class="btn" data-a="retake">Retake quiz</button></div><button class="link" data-open="${s.id}">← Back to set</button>`;
const q=z.qs[z.i],ans=z.pk!==null;let body;
if(q.ty==="id")body=ans?`<p><b>${z.ok?"Correct.":"Not quite."}</b> The answer is: ${esc(q.a)}</p>`:`<input class="in" id="idin" placeholder="Type your answer" aria-label="Your answer"><div class="row2"><button class="btn" data-a="chk">Check answer</button></div>`;
else body=q.o.map((o,i)=>`<button class="opt ${!ans?"":o===q.a?"ok":i===z.pk?"bad":""}" data-a="pick" data-i="${i}" ${ans?"disabled":""}>${esc(o)}</button>`).join("")+(ans?`<p>${q.o[z.pk]===q.a?"Correct.":"Not quite."}${q.ty==="tf"&&q.a==="False"?" The real answer is: "+esc(q.real):""}</p>`:"");
const title=q.ty==="tf"?`True or false: “${esc(q.p)}” means “${esc(q.shown)}”`:q.ty==="id"?`Type the term that matches: “${esc(q.p)}”`:`Which answer matches “${esc(q.p)}”?`;
return `<div class="bar"><b style="width:${z.i/z.qs.length*100}%"></b></div><p class="sub">Question ${z.i+1} of ${z.qs.length} · ${{mc:"Multiple choice",tf:"True or false",id:"Identification"}[q.ty]}</p><h2 style="margin-bottom:18px">${title}</h2>${body}${ans?`<button class="btn" data-a="qnext">${z.i+1<z.qs.length?"Next question":"See results"}</button>`:""}`}
const _act=act;
act=function(b){const a=b.dataset.a,id=b.dataset.id;
if(a==="tool"){A.tool=b.dataset.k;A.out="";return render(1)}
if(a==="gen")return gen();
if(a==="asave"){S.revs.unshift({id:Date.now().toString(36),title:AI[A.tool][0]+": "+A.inp.trim().slice(0,30),body:A.out});save();toast("Saved to Reviewers");return go("rev")}
if(a==="rnew"){const n={id:Date.now().toString(36),title:"Untitled reviewer",body:""};S.revs.unshift(n);save();return go("rev",n.id)}
if(a==="ropen")return go("rev",id);
if(a==="rsave"){const r=S.revs.find(x=>x.id===V.id);r.title=$("#rt").value.trim()||"Untitled reviewer";r.body=$("#rb").value;save();return toast("Reviewer saved")}
if(a==="rdel"){if(confirm("Delete this reviewer? This can’t be undone.")){S.revs=S.revs.filter(x=>x.id!==V.id);save();go("rev")}return}
if(a==="exadd"){const e=EX[+b.dataset.i];S.sets.unshift({id:Date.now().toString(36),title:e.title,subject:e.subject,cards:e.cards.map(c=>({t:c[0],d:c[1]}))});save();return toast("Added “"+e.title+"” to your library")}
if(a==="gsave"){const g=parseInt($("#gl").value,10);if(!(g>=1&&g<=500))return toast("Enter a goal between 1 and 500.");S.goal=g;S.name=($("#nm")?$("#nm").value:"").trim().slice(0,30);save();render(1);return toast("Settings saved")}

if(a==="chk"){const q=z.qs[z.i],n=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim(),v=n($("#idin").value||""),ok=!!v&&v===n(q.a);z.pk=1;z.ok=ok;if(ok)z.sc++;return render(1)}
if(a==="hq"){const l=S.sets.find(x=>x.cards.length>=2);return l?startQuiz(l.id):newSet()}
return _act(b)};
